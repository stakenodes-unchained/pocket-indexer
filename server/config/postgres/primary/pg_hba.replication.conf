# Primary pg_hba.conf for docker-compose postgres service.
# IMPORTANT: update the CIDR below if your replica source IP differs.
# On Docker Desktop (macOS), this is often 192.168.65.1/32.

# Local and loopback access
local   all             all                                     trust
host    all             all             127.0.0.1/32            scram-sha-256
host    all             all             ::1/128                 scram-sha-256

# App access from private networks (tighten this CIDR in production)
host    all             all             10.0.0.0/8              scram-sha-256
host    all             all             172.16.0.0/12           scram-sha-256
host    all             all             192.168.0.0/16          scram-sha-256

# Replication access for standby/basebackup
host    replication     replicator      192.168.65.1/32    scram-sha-256
# hostssl replication     replicator      192.168.1.34/32    scram-sha-256
