version: '3.8'

services:
  redis:
    container_name: pocket_indexer_redis
    image: redis:7-alpine
    ports:
      - "6378:6379"
    volumes:
      - redis-data:/data
    command: >
      redis-server 
      --appendonly yes 
      --save 900 1 
      --save 300 10 
      --save 60 10000 
      --maxmemory 2gb 
      --maxmemory-policy volatile-lru 
      --loglevel warning 
      --tcp-keepalive 300 
      --lazyfree-lazy-eviction yes
      --replicaof no one
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-changeme}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"
    networks:
      - default

  postgres:
    container_name: pocket_indexer_postgres
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASS:-somestringpassword}
      POSTGRES_DB: ${DB_NAME:-pocket_indexer}
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - default

  api:
    container_name: pocket_indexer_api
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "3006:3006"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    # Note: Container runs as root to access Docker socket
    # For better security, use group_add with proper GID mapping:
    group_add:
      - ${DOCKER_GID:-999}
    env_file:
      - .env
    environment:
      - RPC_ENDPOINTS=${RPC_ENDPOINTS}
      - REDIS_URL=${REDIS_URL}
      - PORT=${PORT:-3006}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_DB=${REDIS_DB:-0}
      - WORKER_CONCURRENCY=${WORKER_CONCURRENCY:-2}
      - HISTORICAL_BATCH_SIZE=${HISTORICAL_BATCH_SIZE:-50}
      - CLUSTER_WORKERS=${CLUSTER_WORKERS:-4}
      - HISTORY_CACHE_TTL=${HISTORY_CACHE_TTL:-3600}  # Cache TTL for historical data (1 hour default)
      - TX_EXPIRE_TIME=${TX_EXPIRE_TIME:-2592000}  # Transaction data expiration in seconds (30 days)
      - PROCESSING_DELAY=${PROCESSING_DELAY:-50}   # Delay between transaction batches to prevent Redis overload

      # JWT Configuration
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - JWT_ACCESS_EXPIRY=${JWT_ACCESS_EXPIRY}
      - JWT_REFRESH_EXPIRY=${JWT_REFRESH_EXPIRY}
      

      # Email configuration
      - EMAIL_HOST=${EMAIL_HOST:-smtp.gmail.com}
      - EMAIL_PORT=${EMAIL_PORT:-587}
      - EMAIL_SECURE=${EMAIL_SECURE:-false}
      - EMAIL_USER=${EMAIL_USER}
      - EMAIL_PASSWORD=${EMAIL_PASSWORD}
      - EMAIL_FROM_NAME=${EMAIL_FROM_NAME:-Pocket Indexer}
      - EMAIL_FROM_ADDRESS=${EMAIL_FROM_ADDRESS}
      - EMAIL_VERIFICATION_CODE_EXPIRY=${EMAIL_VERIFICATION_CODE_EXPIRY:-900}
      - EMAIL_VERIFICATION_REQUIRED=${EMAIL_VERIFICATION_REQUIRED:-true}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:5173}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"
    networks:
      - default
      - pocket_indexer_network
    deploy:
      resources:
        limits:
          cpus: '4'

  indexer:
    container_name: pocket_indexer_service
    build:
      context: .
      dockerfile: Dockerfile.indexer
    ports:
      - "3007:3007"
    env_file:
      - .env
    environment:
      - RPC_ENDPOINTS=${RPC_ENDPOINTS}
      - REDIS_URL=${REDIS_URL}
      - PORT=${PORT:-3007}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_DB=${REDIS_DB:-0}
      - WORKER_CONCURRENCY=${WORKER_CONCURRENCY:-2}
      - HISTORICAL_BATCH_SIZE=${HISTORICAL_BATCH_SIZE:-20}  # Reduced from 50 to 20 for memory optimization
      - BLOCK_RESULTS_BATCH_SIZE=${BLOCK_RESULTS_BATCH_SIZE:-20}  # Reduced from 10 to 5 for memory optimization
      - BLOCK_RESULTS_PARALLEL_LIMIT=${BLOCK_RESULTS_PARALLEL_LIMIT:-20}  # Reduced from 5 to 3 for memory optimization
      - DB_POOL_SIZE=${DB_POOL_SIZE:-10}  # Reduced from 20 to 10 for memory optimization
      - DB_POOL_MIN=${DB_POOL_MIN:-2}
      - MEMORY_WARNING_THRESHOLD_GB=${MEMORY_WARNING_THRESHOLD_GB:-12}  # RSS warning threshold in GB
      - NODE_HEAP_SIZE_MB=${NODE_HEAP_SIZE_MB:-32768}  # Node.js heap size limit (32GB default)
      - HISTORY_CACHE_TTL=${HISTORY_CACHE_TTL:-3600}  # Cache TTL for historical data (1 hour default)
      - TX_EXPIRE_TIME=${TX_EXPIRE_TIME:-2592000}  # Transaction data expiration in seconds (30 days)
      - PROCESSING_DELAY=${PROCESSING_DELAY:-50}   # Delay between transaction batches to prevent Redis overload
    deploy:
      resources:
        limits:
          cpus: '8'
    ulimits:
      nofile:
        soft: 8192
        hard: 8192
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 3007 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"
    networks:
      - default
      - pocket_indexer_network

networks:
  default:
  pocket_indexer_network:
    external: true
volumes:
  redis-data:
  pg-data: 